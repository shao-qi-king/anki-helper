<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anki 单词助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f5f5;
            color: #333;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 30px;
            color: #222;
        }
        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }
        .tab {
            padding: 10px 24px;
            cursor: pointer;
            font-size: 15px;
            color: #666;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }
        .tab:hover { color: #333; }
        .tab.active {
            color: #1a73e8;
            border-bottom-color: #1a73e8;
            font-weight: 500;
        }
        .panel { display: none; }
        .panel.active { display: block; }

        /* 搜索框 */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-box input {
            flex: 1;
            padding: 12px 16px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box input:focus { border-color: #1a73e8; }
        .search-hint {
            font-size: 13px;
            color: #999;
            margin-bottom: 16px;
        }
        .btn {
            padding: 10px 20px;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        .btn-primary { background: #1a73e8; color: white; }
        .btn-primary:hover { background: #1557b0; }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
        .btn-success { background: #34a853; color: white; }
        .btn-success:hover { background: #2d8f47; }
        .btn-danger { background: #ea4335; color: white; padding: 6px 12px; font-size: 13px; }
        .btn-danger:hover { background: #c5221f; }

        /* 结果卡片 */
        .result-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: none;
        }
        .result-card.visible { display: block; }
        .result-word { font-size: 26px; font-weight: 600; margin-bottom: 6px; }
        .result-phonetic { color: #666; font-size: 15px; margin-bottom: 14px; }
        .result-definition { font-size: 16px; line-height: 1.6; margin-bottom: 14px; white-space: pre-line; }
        .result-example {
            color: #555; font-style: italic; font-size: 14px;
            padding: 12px; background: #f9f9f9; border-radius: 6px; white-space: pre-line;
        }
        .result-actions {
            margin-top: 16px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .note-input {
            flex: 1;
            min-width: 150px;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        .note-input:focus { border-color: #1a73e8; }

        /* 牌组选择器 */
        .deck-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .deck-selector label { font-size: 14px; color: #666; white-space: nowrap; }
        .deck-selector select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            background: white;
            min-width: 160px;
        }
        .deck-selector select:focus { border-color: #1a73e8; }
        .deck-new-input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            display: none;
            min-width: 160px;
        }
        .deck-new-input.visible { display: block; }

        /* Toast */
        .toast {
            position: fixed; top: 20px; right: 20px;
            padding: 12px 20px; border-radius: 8px; color: white;
            font-size: 14px; opacity: 0; transition: opacity 0.3s; z-index: 1000;
        }
        .toast.show { opacity: 1; }
        .toast.success { background: #34a853; }
        .toast.error { background: #ea4335; }
        .toast.warning { background: #f9ab00; color: #333; }

        /* 单词列表 */
        .list-toolbar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 16px; gap: 12px; flex-wrap: wrap;
        }
        .list-toolbar span { font-size: 14px; color: #666; }
        .word-item {
            background: white; border-radius: 10px; padding: 16px 20px;
            margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; transition: box-shadow 0.2s;
        }
        .word-item:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
        .word-item-left { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; }
        .word-item-word { font-size: 20px; font-weight: 600; }
        .word-item-phonetic { font-size: 14px; color: #888; }
        .word-item-def {
            font-size: 13px; color: #666;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 550px;
        }
        .word-item-right { display: flex; align-items: center; gap: 8px; }
        .btn-speak {
            width: 36px; height: 36px;
            border: none; border-radius: 50%;
            background: #e8f0fe; color: #1a73e8;
            font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }
        .btn-speak:hover { background: #d2e3fc; }
        .word-item-expand {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #eee;
        }
        .word-item-expand.visible { display: block; }
        .word-item-expand-def {
            font-size: 15px; line-height: 1.6;
            white-space: pre-line; margin-bottom: 8px;
        }
        .word-item-expand-example {
            font-size: 13px; color: #666;
            font-style: italic; white-space: pre-line;
        }
        .loading { text-align: center; padding: 40px; color: #999; }

        /* 口语句型面板 */
        .sentence-form { margin-bottom: 20px; }
        .sentence-form label {
            display: block; font-size: 14px; color: #555;
            margin-bottom: 6px; font-weight: 500;
        }
        .sentence-form textarea,
        .sentence-form input[type="text"] {
            width: 100%; padding: 12px 14px;
            border: 1px solid #ddd; border-radius: 8px;
            font-size: 15px; outline: none;
            transition: border-color 0.2s; margin-bottom: 14px;
            font-family: inherit;
        }
        .sentence-form textarea { min-height: 60px; resize: vertical; }
        .sentence-form textarea:focus,
        .sentence-form input[type="text"]:focus { border-color: #1a73e8; }
        .sentence-actions {
            display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
        }
        .btn-outline {
            padding: 10px 18px; font-size: 14px;
            border: 1px solid #1a73e8; border-radius: 8px;
            background: white; color: #1a73e8;
            cursor: pointer; font-weight: 500; transition: all 0.2s;
        }
        .btn-outline:hover { background: #e8f0fe; }
</style>
</head>
<body>
    <div class="container">
        <h1>Anki 单词助手</h1>
        <div class="tabs">
            <div class="tab active" data-panel="add">添加单词</div>
            <div class="tab" data-panel="sentence">口语句型</div>
            <div class="tab" data-panel="list">单词列表</div>
        </div>
        <!-- 添加面板 -->
        <div class="panel active" id="panel-add">
            <div class="search-box">
                <input type="text" id="word-input" placeholder="输入英文或中文，按 Enter 查询..."
                       autocomplete="off" autofocus>
                <button class="btn btn-primary" id="btn-search">查词</button>
            </div>
            <div class="search-hint">支持英文查中文、中文查英文</div>
            <div class="result-card" id="result-card">
                <div style="display:flex; align-items:center; gap:12px;">
                    <div class="result-word" id="result-word"></div>
                    <button class="btn-speak" id="btn-speak-result" onclick="speak(currentResult && currentResult.word)" title="发音">&#x1f50a;</button>
                </div>
                <div class="result-phonetic" id="result-phonetic"></div>
                <div class="result-definition" id="result-definition"></div>
                <div class="result-example" id="result-example"></div>
                <div class="result-actions">
                    <div class="deck-selector">
                        <label>牌组:</label>
                        <select id="deck-select">
                            <option value="">加载中...</option>
                        </select>
                        <input type="text" class="deck-new-input" id="deck-new-input"
                               placeholder="输入新牌组名">
                    </div>
                </div>
                <div class="result-actions">
                    <input type="text" class="note-input" id="note-input"
                           placeholder="备注（可选）">
                    <button class="btn btn-success" id="btn-add">添加到 Anki</button>
                </div>
            </div>
        </div>

        <!-- 口语句型面板 -->
        <div class="panel" id="panel-sentence">
            <div class="sentence-form">
                <label>中文（你想说的话）</label>
                <textarea id="sentence-chinese" placeholder="例如：这里春天总是晴天"></textarea>

                <label>英文句子</label>
                <div style="display:flex;gap:10px;margin-bottom:14px;">
                    <input type="text" id="sentence-english" placeholder="输入英文，或点翻译自动生成" style="margin-bottom:0;flex:1;">
                    <button class="btn-outline" id="btn-translate">翻译</button>
                    <button class="btn-speak" onclick="speak(document.getElementById('sentence-english').value)" title="试听" style="flex-shrink:0;">&#x1f50a;</button>
                </div>

                <label>语法点（可选）</label>
                <input type="text" id="sentence-grammar" placeholder="例如：It is + adj + 地点 + in + 季节">

                <label>备注（可选）</label>
                <input type="text" id="sentence-note" placeholder="例如：多邻国第3章">

                <div class="sentence-actions">
                    <div class="deck-selector">
                        <label>牌组:</label>
                        <select id="sentence-deck-select">
                            <option value="">加载中...</option>
                        </select>
                        <input type="text" class="deck-new-input" id="sentence-deck-new"
                               placeholder="输入新牌组名">
                    </div>
                    <button class="btn btn-success" id="btn-sentence-add">添加到 Anki</button>
                </div>
            </div>
        </div>

        <!-- 单词列表面板 -->
        <div class="panel" id="panel-list">
            <div class="list-toolbar">
                <div class="deck-selector">
                    <label>牌组:</label>
                    <select id="list-deck-select">
                        <option value="">加载中...</option>
                    </select>
                </div>
                <span id="word-count"></span>
                <button class="btn btn-primary" id="btn-refresh" style="padding:8px 14px;font-size:13px;">刷新</button>
            </div>
            <div id="word-list"></div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
<script>
const $ = id => document.getElementById(id);
let currentResult = null;
let decksLoaded = false;

function toast(msg, type = 'success') {
    const el = $('toast');
    el.textContent = msg;
    el.className = `toast show ${type}`;
    setTimeout(() => el.className = 'toast', 2500);
}

// 牌组加载
async function loadDecks() {
    if (decksLoaded) return;
    try {
        const resp = await fetch('/api/decks');
        const data = await resp.json();
        if (data.error) {
            toast('无法获取牌组: ' + data.error, 'error');
            return;
        }
        const decks = data.decks;
        const defaultDeck = data.default;

        // 填充添加面板的牌组选择器
        const addSelect = $('deck-select');
        addSelect.innerHTML = '';
        decks.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d;
            opt.textContent = d;
            if (d === defaultDeck) opt.selected = true;
            addSelect.appendChild(opt);
        });
        // 新建牌组选项
        const newOpt = document.createElement('option');
        newOpt.value = '__new__';
        newOpt.textContent = '+ 新建牌组...';
        addSelect.appendChild(newOpt);

        // 填充列表面板的牌组选择器
        const listSelect = $('list-deck-select');
        listSelect.innerHTML = '';
        decks.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d;
            opt.textContent = d;
            if (d === defaultDeck) opt.selected = true;
            listSelect.appendChild(opt);
        });

        // 填充口语句型面板的牌组选择器
        const sentSelect = $('sentence-deck-select');
        sentSelect.innerHTML = '';
        decks.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d;
            opt.textContent = d;
            if (d === 'English Sentences') opt.selected = true;
            sentSelect.appendChild(opt);
        });
        const sentNewOpt = document.createElement('option');
        sentNewOpt.value = '__new__';
        sentNewOpt.textContent = '+ 新建牌组...';
        sentSelect.appendChild(sentNewOpt);

        decksLoaded = true;
    } catch (e) {
        // Anki 未运行时不阻塞页面
    }
}

// 牌组选择 - 新建处理
$('deck-select').addEventListener('change', () => {
    const val = $('deck-select').value;
    if (val === '__new__') {
        $('deck-new-input').classList.add('visible');
        $('deck-new-input').focus();
    } else {
        $('deck-new-input').classList.remove('visible');
    }
});

function getSelectedDeck() {
    const val = $('deck-select').value;
    if (val === '__new__') {
        return $('deck-new-input').value.trim();
    }
    return val;
}

// Tabs
document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        $(`panel-${tab.dataset.panel}`).classList.add('active');
        if (tab.dataset.panel === 'list') loadWords();
    });
});

// Search
async function searchWord() {
    const word = $('word-input').value.trim();
    if (!word) return;
    $('btn-search').disabled = true;
    $('btn-search').textContent = '查询中...';
    try {
        const resp = await fetch('/api/search', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({word})
        });
        const data = await resp.json();
        if (data.found) {
            currentResult = data;
            $('result-word').textContent = data.word;
            $('result-phonetic').textContent = data.phonetic || '';
            $('result-definition').textContent = data.definition;
            $('result-example').textContent = data.example || '';
            $('result-card').classList.add('visible');
            loadDecks();
            speak(data.word);
        } else {
            toast('未找到该单词', 'warning');
            $('result-card').classList.remove('visible');
        }
    } catch (e) {
        toast('查询失败: ' + e.message, 'error');
    }
    $('btn-search').disabled = false;
    $('btn-search').textContent = '查词';
}

$('btn-search').addEventListener('click', searchWord);
$('word-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') searchWord();
});

// Add to Anki
$('btn-add').addEventListener('click', async () => {
    if (!currentResult) return;
    const deck = getSelectedDeck();
    if (!deck) {
        toast('请选择或输入牌组名', 'warning');
        return;
    }
    $('btn-add').disabled = true;
    try {
        const resp = await fetch('/api/add', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                ...currentResult,
                note: $('note-input').value.trim(),
                deck: deck
            })
        });
        const data = await resp.json();
        if (data.success) {
            toast(`已添加到「${deck}」`);
            $('word-input').value = '';
            $('note-input').value = '';
            $('result-card').classList.remove('visible');
            currentResult = null;
            $('word-input').focus();
            // 如果是新建牌组，刷新列表
            if ($('deck-select').value === '__new__') {
                decksLoaded = false;
                loadDecks();
            }
        } else {
            toast(data.message || data.error, 'warning');
        }
    } catch (e) {
        toast('添加失败: ' + e.message, 'error');
    }
    $('btn-add').disabled = false;
});

// 发音功能 - 使用有道在线发音
function speak(word) {
    if (!word) return;
    const audio = new Audio(`https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(word)}&type=2`);
    audio.play().catch(() => {
        // type=2 是美式，fallback 用 type=1 英式
        const fallback = new Audio(`https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(word)}&type=1`);
        fallback.play().catch(() => {});
    });
}

// Word list
async function loadWords() {
    await loadDecks();
    const deck = $('list-deck-select').value;
    if (!deck) return;
    $('word-list').innerHTML = '<div class="loading">加载中...</div>';
    try {
        const resp = await fetch(`/api/words?deck=${encodeURIComponent(deck)}`);
        const data = await resp.json();
        if (data.error) {
            $('word-list').innerHTML = `<div class="loading">${data.error}</div>`;
            $('word-count').textContent = '';
            return;
        }
        $('word-count').textContent = `共 ${data.length} 个单词`;
        if (data.length === 0) {
            $('word-list').innerHTML = '<div class="loading">该牌组还没有单词</div>';
            return;
        }
        $('word-list').innerHTML = data.map(w => `
            <div class="word-item" data-id="${w.id}" onclick="toggleExpand(this)">
                <div class="word-item-left">
                    <div>
                        <span class="word-item-word">${w.word}</span>
                        <span class="word-item-phonetic">${w.phonetic}</span>
                    </div>
                </div>
                <div class="word-item-right">
                    <button class="btn-speak" onclick="event.stopPropagation(); speak('${w.word.replace(/'/g, "\\'")}')" title="发音">&#x1f50a;</button>
                    <button class="btn btn-danger" onclick="event.stopPropagation(); deleteWord(${w.id})">删除</button>
                </div>
                <div class="word-item-expand">
                    <div class="word-item-expand-def">${w.definition}</div>
                    ${w.example ? `<div class="word-item-expand-example">${w.example}</div>` : ''}
                </div>
            </div>
        `).join('');

        // 自动朗读第一个单词
        if (data.length > 0) {
            setTimeout(() => speak(data[0].word), 300);
        }
    } catch (e) {
        $('word-list').innerHTML = `<div class="loading">加载失败: ${e.message}</div>`;
    }
}

function toggleExpand(el) {
    const expand = el.querySelector('.word-item-expand');
    expand.classList.toggle('visible');
}

$('list-deck-select').addEventListener('change', loadWords);

async function deleteWord(id) {
    if (!confirm('确定删除这个单词？')) return;
    try {
        const resp = await fetch('/api/delete', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id})
        });
        const data = await resp.json();
        if (data.success) {
            toast('已删除');
            loadWords();
        } else {
            toast(data.error, 'error');
        }
    } catch (e) {
        toast('删除失败', 'error');
    }
}

$('btn-refresh').addEventListener('click', loadWords);

// === 口语句型 ===
$('sentence-deck-select').addEventListener('change', () => {
    if ($('sentence-deck-select').value === '__new__') {
        $('sentence-deck-new').classList.add('visible');
        $('sentence-deck-new').focus();
    } else {
        $('sentence-deck-new').classList.remove('visible');
    }
});

function getSentenceDeck() {
    const val = $('sentence-deck-select').value;
    if (val === '__new__') return $('sentence-deck-new').value.trim();
    return val;
}

// 翻译按钮
$('btn-translate').addEventListener('click', async () => {
    const chinese = $('sentence-chinese').value.trim();
    if (!chinese) { toast('请先输入中文', 'warning'); return; }
    $('btn-translate').disabled = true;
    $('btn-translate').textContent = '翻译中...';
    try {
        const resp = await fetch('/api/sentence/translate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({chinese})
        });
        const data = await resp.json();
        if (data.found && data.english) {
            $('sentence-english').value = data.english;
            speak(data.english);
        } else {
            toast('翻译失败，请手动输入英文', 'warning');
        }
    } catch (e) {
        toast('翻译失败: ' + e.message, 'error');
    }
    $('btn-translate').disabled = false;
    $('btn-translate').textContent = '翻译';
});

// 添加句型
$('btn-sentence-add').addEventListener('click', async () => {
    const chinese = $('sentence-chinese').value.trim();
    const english = $('sentence-english').value.trim();
    const grammar = $('sentence-grammar').value.trim();
    const note = $('sentence-note').value.trim();
    const deck = getSentenceDeck();

    if (!chinese || !english) {
        toast('中文和英文都要填', 'warning');
        return;
    }
    if (!deck) {
        toast('请选择牌组', 'warning');
        return;
    }

    $('btn-sentence-add').disabled = true;
    try {
        const resp = await fetch('/api/sentence/add', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({chinese, english, grammar, note, deck})
        });
        const data = await resp.json();
        if (data.success) {
            toast(`已添加到「${deck}」`);
            $('sentence-chinese').value = '';
            $('sentence-english').value = '';
            $('sentence-grammar').value = '';
            $('sentence-note').value = '';
            $('sentence-chinese').focus();
            if ($('sentence-deck-select').value === '__new__') {
                decksLoaded = false;
                loadDecks();
            }
        } else {
            toast(data.message || data.error, 'warning');
        }
    } catch (e) {
        toast('添加失败: ' + e.message, 'error');
    }
    $('btn-sentence-add').disabled = false;
});

loadDecks();
</script>
</body>
